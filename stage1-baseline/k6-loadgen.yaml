apiVersion: v1
kind: Pod
metadata:
  name: k6-loadgen
  labels:
    app: k6-loadgen
spec:
  restartPolicy: Never
  # Pin to node0 (control plane) — no Online Boutique pods there, so load
  # generation doesn't skew service pod placement or topology-aware routing.
  nodeSelector:
    node-role.kubernetes.io/control-plane: ""
  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"
  containers:
    - name: k6
      image: grafana/k6:latest
      # Keep pod alive between burst runs so we don't pay pod startup overhead.
      command: ["sleep", "infinity"]
      resources:
        requests:
          cpu: "500m"
          memory: "512Mi"
        limits:
          cpu: "2000m"
          memory: "1500Mi"
