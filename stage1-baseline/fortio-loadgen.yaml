apiVersion: v1
kind: Pod
metadata:
  name: fortio-loadgen
  labels:
    app: fortio-loadgen
spec:
  restartPolicy: Never
  # Pin to node0 (control plane) — no Online Boutique pods there, so load
  # generation doesn't skew service pod placement or topology-aware routing.
  nodeSelector:
    node-role.kubernetes.io/control-plane: ""
  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"
  containers:
    - name: fortio
      image: fortio/fortio:latest
      command: ["fortio", "server", "-http-port", "disabled", "-grpc-port", "disabled"]
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 256Mi
